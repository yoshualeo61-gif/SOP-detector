name: Build and push image

# Builds the detector image on GitHub's runner (no local Docker needed) and pushes it to
# the TRACE account's ECR repository, then restarts the detector service if it exists.
# Run it from the Actions tab once the repository exists (deploy/aws/README.md, step 1).
# Needs the repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-push-ecr
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: video2text-sop-detector
  ECS_CLUSTER: video2text-sop-detector
  ECS_SERVICE: video2text-sop-detector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # torch, easyocr and ultralytics make the image about 4.5 GB; the runner only has
      # ~14 GB free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # The service runs the "latest" tag; a new deployment makes it pull the image just
      # pushed. Skipped on the first run, before Terraform has created the service.
      - name: Restart the detector service
        run: |
          status=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || true)
          if [ "$status" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --force-new-deployment > /dev/null
            echo "New deployment started; it takes a few minutes to pull and start."
          else
            echo "No detector service yet; skipping the restart."
          fi
